<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Weather</title>
</head>
<body>
    <h1>Current Weather</h1>
    <button onclick="getWeather()">getWeather</button>

    <div id="weatherResult"></div>
    
</body>
<script>
    const apikey = "e708724dbde6c61160288a5f86baed57";

    async function getWeather() {
        console.log("Prompt opened. " + Date());
        const city = prompt("Enter a city name");
        console.log("Prompt closed. " + Date());
        
        if(!city){
            alert("No city entered.");
            console.log("No city entered. " + Date());
            returm;

        }
        

    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apikey}&units=mentric`;

    try{
        const response = await fetch(url);
        if(!response.ok) throw new Error("City not found");
        
        const data = await response.json();

        const weatherResult = document.getElementById("weatherResult");
        weatherResult.innerHTML = `
        <h2>${data.name}, ${data.sys.country}</h2>
        <p>temperature: ${data.main.temp}C</p>
        <p>Weather: ${data.weather[0].description}</p>
        <p>humidity: ${data.main.Humidity}%</p>
        <p>Wind Speed: ${data.wind.speed}m/s</p>

        `;
    }catch (error){
       //lert("Error: "+ error.message);
        console.log("Error: "+ error.message)
    }
    
}
</script>
</html>

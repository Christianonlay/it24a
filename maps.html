<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
      <style>
        #map { height: 400px; }
        .popup-image {
            max-width: 200px;
            height: auto;
        }
     </style>


</head>
<body>
    <h1>basic Map</h1>
    <div id="map"></div>

</body>
<script>

function initMap(mapdataUrl){
    var map = L.map('map').setView([8.360053042057906, 124.86834154336864], 17);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

fetch(mapdataUrl)
.then(Response => response.json())
.then(data =>{
    data.forEach(pin=>{
        const marker = L.marker([pin.lat,pin.longitude]).addto(map);
        const img = "<img scr= `pin.ing` class=popup-image>";
        const popupContent = `$(img)<br><b> pin.title </b><br> ${pin.description} `;
        console.log(`${pin.name} loaded` + Date());
    });

})  
.catch(err=>console.error(`Error loading JSON:`, err));  
}
document.addEventListener('DOMContentLoaded',()=>{
    initMap('maps.json');
})
    
</script>
</html>
